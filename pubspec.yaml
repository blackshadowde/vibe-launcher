name: vibe_launcher
description: A Discord-style Android launcher. Apps are users, notifications are messages.
publish_to: 'none'
version: 0.14.0+14

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2

flutter:
  uses-material-design: true
  fonts:
    - family: GGSans
      fonts:
        - asset: assets/fonts/GGSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GGSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GGSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/GGSans-Bold.ttf
          weight: 700
