name: Launcher build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the Android project files we don't keep in the repo
      - name: Create Android project
        run: |
          flutter create --platforms android --org com.vibe --project-name vibe_launcher .
          rm -rf test
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/vibe/vibe_launcher
          cp android_overrides/kotlin/*.kt android/app/src/main/kotlin/com/vibe/vibe_launcher/

      # On-phone AI (Gemini Nano) needs Android 8+ and Google's ML Kit library
      - name: Add Android libraries
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' "$F"
          cat >> "$F" <<'GRADLE'

          dependencies {
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          GRADLE
          grep -n "minSdk" "$F" || true

      - run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build APK
        run: flutter build apk --release

      # Signs with your own key when the two repository secrets exist; otherwise keeps the default signature
      - name: Sign with your key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "No signing key secrets set, keeping the default signature"; exit 0; fi
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks ks.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out build/app/outputs/flutter-apk/signed.apk build/app/outputs/flutter-apk/app-release.apk
          mv build/app/outputs/flutter-apk/signed.apk build/app/outputs/flutter-apk/app-release.apk
          rm ks.jks

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-launcher
          path: build/app/outputs/flutter-apk/app-release.apk
