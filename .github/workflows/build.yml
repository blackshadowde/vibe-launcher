name: Launcher build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the build publish a GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the Android project files we don't keep in the repo
      - name: Create Android project
        run: |
          flutter create --platforms android --org com.vibe --project-name vibe_launcher .
          rm -rf test
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/vibe/vibe_launcher
          cp android_overrides/kotlin/*.kt android/app/src/main/kotlin/com/vibe/vibe_launcher/
          # App icon (Home bubble) and other Android resources
          if [ -d android_overrides/res ]; then cp -r android_overrides/res/. android/app/src/main/res/; fi
          # Keep rules for code-shrinking (ML Kit on-phone AI needs them)
          if [ -f android_overrides/proguard-rules.pro ]; then cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro; fi

      # On-phone AI (Gemini Nano) needs Android 8+ and Google's ML Kit library
      - name: Add Android libraries
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' "$F"
          cat >> "$F" <<'GRADLE'

          // Use our keep rules in release builds too (Flutter's own rules stay)
          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles("proguard-rules.pro")
                  }
              }
          }

          dependencies {
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-session:1.4.1")
              implementation("androidx.core:core-ktx:1.13.1")
          }

          // 64-bit ARM phones only (all modern phones): keeps the Telegram library from tripling the APK size
          android {
              defaultConfig {
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
          }
          GRADLE
          grep -n "minSdk" "$F" || true

      - run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      # Release signing with your own key (repository secrets). Without them the build stops here,
      # so you never get an APK signed with the throwaway debug key by mistake.
      - name: Set up release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Signing secrets missing. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions (Repository secrets)."
            exit 1
          fi
          PASS=$(printf %s "$KS_PASS" | tr -d '\r\n')
          printf %s "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/vibe.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/vibe.jks" -storepass "$PASS" >/dev/null 2>&1; then
            echo "::error::The keystore or its password is wrong. Re-paste both secrets from the key zip (whole text, nothing extra)."
            exit 1
          fi
          ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/vibe.jks" -storepass "$PASS" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          keytool -list -keystore "$RUNNER_TEMP/vibe.jks" -storepass "$PASS" | grep SHA-256
          {
            echo "VIBE_KS=$RUNNER_TEMP/vibe.jks"
            echo "VIBE_KS_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "VIBE_KS_PASS=$PASS" >> "$GITHUB_ENV"
          F=android/app/build.gradle.kts
          if [ -f "$F" ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("vibe")/' "$F"
            sed -i '0,/^    buildTypes {/s//    signingConfigs {\n        create("vibe") {\n            storeFile = file(System.getenv("VIBE_KS"))\n            storePassword = System.getenv("VIBE_KS_PASS")\n            keyAlias = System.getenv("VIBE_KS_ALIAS")\n            keyPassword = System.getenv("VIBE_KS_PASS")\n        }\n    }\n    buildTypes {/' "$F"
          else
            F=android/app/build.gradle
            sed -i "s/signingConfig signingConfigs.debug/signingConfig signingConfigs.vibe/" "$F"
            sed -i '0,/^    buildTypes {/s//    signingConfigs {\n        vibe {\n            storeFile file(System.getenv("VIBE_KS"))\n            storePassword System.getenv("VIBE_KS_PASS")\n            keyAlias System.getenv("VIBE_KS_ALIAS")\n            keyPassword System.getenv("VIBE_KS_PASS")\n        }\n    }\n    buildTypes {/' "$F"
          fi
          grep -n -A8 "signingConfigs {" "$F"
          grep -q 'getByName("vibe")\|signingConfigs.vibe' "$F" || { echo "::error::Couldn't switch the release build to your key"; exit 1; }

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # Proves the APK carries your key, not the debug one
      - name: Check signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          if echo "$OUT" | grep -q "Android Debug"; then echo "::error::APK is still signed with the debug key"; exit 1; fi
          rm -f "$RUNNER_TEMP/vibe.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-launcher
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publishes a release (v + the version in pubspec.yaml) with the signed APK.
      # Same version again = the APK in that release is replaced. Bump the version for a new release.
      - name: Publish release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          APK="vibe-launcher-v$V.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$APK" --clobber
          else
            gh release create "v$V" "$APK" --target "$GITHUB_SHA" --title "Vibe Launcher $V" \
              --notes "Signed build of commit ${GITHUB_SHA::7}. Install over the previous version; your chats and settings stay."
          fi
